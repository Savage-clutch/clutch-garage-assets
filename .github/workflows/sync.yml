name: Sync from the Garage

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: garage-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/sync.py
      - name: Commit changes
        run: |
          git config user.name "garage-sync"
          git config user.email "garage-sync@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -m "Sync from the Garage" && git push; }
